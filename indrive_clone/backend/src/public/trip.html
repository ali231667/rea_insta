<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live trip</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --lime: #c1f11d; --dark: #141414; --grey: #777; --bg: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--dark); background: var(--bg); }
  #map { position: fixed; inset: 0 0 210px 0; }
  .card { position: fixed; left: 0; right: 0; bottom: 0; min-height: 210px; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.15); padding: 16px 20px; }
  .status { font-size: 20px; font-weight: 800; }
  .muted { color: var(--grey); font-size: 14px; }
  .plate { display: inline-block; border: 2px solid var(--dark); border-radius: 6px; padding: 2px 8px; font-weight: 900; letter-spacing: 1px; }
  .row { margin-top: 8px; }
  .brand { position: fixed; top: 12px; left: 12px; z-index: 999; background: var(--lime); padding: 6px 12px; border-radius: 20px; font-weight: 800; }
</style>
</head>
<body>
<div class="brand">inDrive clone · live trip</div>
<div id="map"></div>
<div class="card">
  <div class="status" id="status">Loading…</div>
  <div class="muted" id="sub"></div>
  <div class="row" id="driver"></div>
  <div class="row muted" id="addr"></div>
  <div class="row muted" id="upd"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const parts = location.pathname.split('/');
const api = `/api/v1/share/${parts[2]}/${parts[3]}`;
const map = L.map('map', { zoomControl: false }).setView([31.52, 74.35], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function decode(str) {
  const pts = []; let i = 0, lat = 0, lng = 0;
  const next = () => { let r = 0, s = 0, b; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20); return (r & 1) ? -(r >> 1) - 1 : r >> 1; };
  while (i < str.length) { lat += next(); lng += next(); pts.push([lat / 1e5, lng / 1e5]); }
  return pts;
}
const titles = { searching: 'Looking for a driver', accepted: 'Driver is coming to the pickup', arrived: 'Driver is at the pickup point', in_progress: 'On the way to the destination', completed: 'Arrived safely ✅', cancelled: 'Ride cancelled', expired: 'Ride request ended' };
let car, drawn = false;
async function load() {
  try {
    const r = await fetch(api); const d = await r.json();
    if (!r.ok) { document.getElementById('status').textContent = d.error?.message || 'Link not valid'; return; }
    document.getElementById('status').textContent = titles[d.status] || d.status;
    document.getElementById('sub').textContent = `${d.passengerName}'s trip`;
    document.getElementById('driver').innerHTML = d.driver ? `${esc(d.driver.name)} · ${esc(d.driver.vehicle)} <span class="plate">${esc(d.driver.plateNumber)}</span> · ★ ${esc(d.driver.rating)}` : '';
    document.getElementById('addr').textContent = `${d.pickup.address} → ${d.dropoff.address}`;
    document.getElementById('upd').textContent = `Updated ${new Date(d.updatedAt).toLocaleTimeString()}`;
    if (!drawn) {
      drawn = true;
      L.circleMarker([d.pickup.lat, d.pickup.lng], { radius: 9, color: '#fff', fillColor: '#9bc70a', fillOpacity: 1, weight: 3 }).addTo(map);
      L.circleMarker([d.dropoff.lat, d.dropoff.lng], { radius: 9, color: '#fff', fillColor: '#141414', fillOpacity: 1, weight: 3 }).addTo(map);
      const pts = d.routePolyline ? decode(d.routePolyline) : [[d.pickup.lat, d.pickup.lng], [d.dropoff.lat, d.dropoff.lng]];
      const line = L.polyline(pts, { color: '#141414', weight: 5 }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [40, 40] });
    }
    if (d.car) {
      const p = [d.car.lat, d.car.lng];
      if (!car) car = L.circleMarker(p, { radius: 11, color: '#141414', fillColor: '#c1f11d', fillOpacity: 1, weight: 3 }).addTo(map).bindTooltip('Car');
      else car.setLatLng(p);
    }
  } catch (e) { document.getElementById('upd').textContent = 'Connection problem, retrying…'; }
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
