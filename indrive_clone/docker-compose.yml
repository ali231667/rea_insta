# Start everything with:  docker compose up --build
# API: http://localhost:4000   Admin: http://localhost:4000/admin  (key: admin123)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: indrive
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      NODE_ENV: production
      PUBLIC_URL: http://localhost:4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/indrive
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-at-least-32-chars
      DEV_OTP: "true"
      AUTO_APPROVE_DRIVERS: "true"
      ADMIN_KEY: admin123
    volumes: [uploads:/app/uploads]

volumes:
  pgdata:
  uploads:
